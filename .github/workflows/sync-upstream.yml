name: Sync upstream

# Proposes the next DrKLO/Telegram release as a pull request into dev. It never
# pushes dev: the PR review and ci.yml are the gate.
#
# Telegram history is never merged directly (it would import upstream authors
# and untagged commits). Instead its tree is wrapped in one locally-authored
# snapshot commit whose parent is the previous snapshot, found in dev's own
# history by the sync identity. dev already contains that snapshot, so the
# 3-way merge applies exactly the upstream delta.
#
# - Up to date: nothing happens.
# - Clean merge: pushes <date>_upstream-<version> and opens a PR.
# - Conflicts: pushes the snapshot to nbase and the run says how to finish on a PC.
#
# The sync PR must land as a merge commit, not a squash, or the next sync loses
# its merge base. See the branch-flow skill.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/DrKLO/Telegram.git
  UPSTREAM_BRANCH: master
  SYNC_NAME: dazegram-sync
  SYNC_EMAIL: sync@dazegram.local

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # A PR opened with GITHUB_TOKEN would not trigger ci.yml.
          [ -n "$SYNC_TOKEN" ] || { echo "::error::SYNC_TOKEN secret is not set"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Snapshot and merge
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "$SYNC_NAME"
          git config user.email "$SYNC_EMAIL"
          export GIT_AUTHOR_NAME="$SYNC_NAME" GIT_AUTHOR_EMAIL="$SYNC_EMAIL"
          export GIT_COMMITTER_NAME="$SYNC_NAME" GIT_COMMITTER_EMAIL="$SYNC_EMAIL"

          git fetch --no-tags "$UPSTREAM" "$UPSTREAM_BRANCH"
          SRC=$(git rev-parse FETCH_HEAD)
          SRC_TREE=$(git rev-parse "FETCH_HEAD^{tree}")
          VERSION=$(git show "$SRC:gradle.properties" | sed -n 's/^APP_VERSION_NAME=//p' | tr -d '\r')
          PREV=$(git log -1 --format=%H --author="$SYNC_EMAIL" origin/dev)
          echo "source $SRC ($VERSION), previous snapshot $PREV" >> "$GITHUB_STEP_SUMMARY"

          if [ "$(git rev-parse "$PREV^{tree}")" = "$SRC_TREE" ]; then
            echo "Up to date with Telegram $VERSION." >> "$GITHUB_STEP_SUMMARY"
            echo "result=uptodate" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # nbase points at the newest snapshot. If it is not in dev yet, an
          # earlier sync is still waiting to land; finish that one first.
          if git rev-parse -q --verify origin/nbase >/dev/null \
             && ! git merge-base --is-ancestor origin/nbase origin/dev; then
            echo "::error::origin/nbase is not merged into dev yet; an earlier sync is still open."
            echo "result=inflight" >> "$GITHUB_OUTPUT"; exit 1
          fi

          SNAP=$(git commit-tree "$SRC_TREE" -p "$PREV" \
            -m "snapshot Telegram $VERSION source $(git rev-parse --short=10 "$SRC") #infra")
          git push origin "$SNAP:refs/heads/nbase"

          BRANCH="$(date -u +%F)_upstream-${VERSION//./-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH" origin/dev
          if git merge --no-ff --no-edit -m "merge Telegram $VERSION into dev #infra" "$SNAP"; then
            git push origin "$BRANCH"
            gh pr create --base dev --head "$BRANCH" \
              --title "merge Telegram $VERSION" \
              --body "Merges Telegram $VERSION (source \`$SRC\`, snapshot \`$SNAP\`). The merge was conflict-free; ci.yml is the compile gate. Land it as a merge commit, not a squash."
            echo "result=pr" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### Merge conflicts"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo
              echo "Finish on a PC:"
              echo '```'
              echo "git fetch origin dev nbase"
              echo "git switch -c $BRANCH origin/dev"
              echo "git merge origin/nbase"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "conflicts=$(git diff --name-only --diff-filter=U | wc -l)" >> "$GITHUB_OUTPUT"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Notify
        if: always() && steps.sync.outputs.result != 'uptodate'
        env:
          HELPER_BOT_TOKEN: ${{ secrets.HELPER_BOT_TOKEN }}
          HELPER_BOT_TARGET: ${{ secrets.HELPER_BOT_TARGET }}
          RESULT: ${{ steps.sync.outputs.result }}
          VERSION: ${{ steps.sync.outputs.version }}
          BRANCH: ${{ steps.sync.outputs.branch }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$HELPER_BOT_TOKEN" ] && [ -n "$HELPER_BOT_TARGET" ] || exit 0
          case "$RESULT" in
            pr)       TEXT="DwellGram sync: Telegram $VERSION merged cleanly, PR opened from $BRANCH." ;;
            conflict) TEXT="DwellGram sync: Telegram $VERSION has $CONFLICTS conflicting files. Snapshot is on nbase; finish on the PC." ;;
            *)        TEXT="DwellGram sync failed." ;;
          esac
          curl -sS --fail "https://api.telegram.org/bot${HELPER_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${HELPER_BOT_TARGET}" \
            --data-urlencode "text=${TEXT}
          ${RUN_URL}" >/dev/null || echo "::warning::Telegram notification failed"
