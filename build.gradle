import groovy.xml.XmlSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
    id 'com.google.firebase.crashlytics' version '3.0.8' apply false
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.library") || plugins.hasPlugin("com.android.application")) {
            android {
                compileSdk = 37
                buildToolsVersion = "36.0.0"
                ndkVersion = "27.2.12479018"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_21
                    targetCompatibility = JavaVersion.VERSION_21

                    // NagramX: the media submodule declares no desugaring dependency
                    coreLibraryDesugaringEnabled = !project.projectDir.absolutePath.replace('\\', '/').contains('/TMessagesProj_Modules/media/')
                }

                // NagramX: with android.builtInKotlin off, only projects that apply a Kotlin plugin have this extension
                if (project.extensions.findByName('kotlin') != null) {
                    kotlin {
                        compilerOptions {
                            jvmTarget = JvmTarget.JVM_21
                        }
                    }
                }

                defaultConfig {
                    minSdk = 27
                    targetSdk = 36
                }

                buildFeatures.buildConfig = true
                buildFeatures.resValues = true
            }
        }
    }

    if (project.projectDir.absolutePath.replace('\\', '/').contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}
