pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "NagramX"
include ':TMessagesProj'

// NagramX: the media submodule hard-codes the :TMessagesProj_Modules:media3: project path, so the
// prefix must stay nested. Gradle 9 rejects the implicit parent projects that creates unless their directory exists.
gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")
project(':TMessagesProj_Modules:media3').projectDir = file('TMessagesProj_Modules/media/libraries')

// Nothing we build depends on common-ktx, so its build script is skipped rather than configured.
project(':TMessagesProj_Modules:media3:media-lib-common-ktx').buildFileName = 'unused.gradle'
